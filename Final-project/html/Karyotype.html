<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Karyotype</title>
  <style>
    body { background-color: #9b59b6; font-family: serif; padding: 20px; }
    h1 { font-size: 36px; font-weight: bold; }
    ul { font-size: 18px; }
    p  { font-size: 18px; }
    a  { color: #2c0040; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Karyotype of {{ context.species }}</h1>
  {% if context.karyotype %}
    <ul>
      {% for c in context.karyotype %}
        <li>{{ c }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No karyotype data available.</p>
  {% endif %}
  <br><a href="/">&#8592; Back to main page</a>
</body>
</html>
